# Marketing site (www.syndiary.com) — static, no build step.
# Publishes the www/ subdirectory; the docs/ app deploys separately on Cloudflare.
# Netlify Forms + reCAPTCHA post-processing runs against HTML in the publish dir.
[build]
  publish = "www"
  # Production always builds: deploy-preview cache refs can match main even while the published deploy is stale.
  # Non-production deploys still skip docs-only changes. Missing refs fail closed to a build.
  ignore = "test \"$CONTEXT\" != \"production\" && test -n \"$CACHED_COMMIT_REF\" && test -n \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- www netlify netlify.toml package.json package-lock.json"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
